name = "amb-daily-reporting"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
WATCHED_TEAMS  = "164470267910"   # always-on seed team(s); every OTHER team the bot is added to is learned automatically
EXCLUDE_TEAMS  = "1851899910"     # org-wide "Everyone" team — never post the report there
WEBHOOK_URL    = "https://amb-daily-reporting.maddala-nitesh.workers.dev/"  # RingCentral pushes events here (instant)

[triggers]
crons = ["* * * * *", "30 4 * * 1-5"]   # every-minute /gr poll  +  10:00 IST daily (04:30 UTC, Mon-Fri)

[[kv_namespaces]]
binding = "LASTSEEN"
id = "31aa44633f0b43b1bacd1f2f1ce489da"

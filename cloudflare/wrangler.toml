name = "amb-daily-reporting"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
WATCHED_TEAMS  = "164470267910,164472373254"   # explicit teams the bot serves (both verified as members); more are learned automatically
EXCLUDE_TEAMS  = "1851899910"     # org-wide "Everyone" team — never post the report there
DAILY_AT       = "10:00"          # IST send time (HH:MM, weekdays); verify +20m, alert +40m
SLACK_DAILY    = "on"             # weekday daily → every Slack channel the bot is in
RC_ENABLED     = "off"            # RingCentral retired (Oct 2026): no RC polling, webhook or daily
WEBHOOK_URL    = "https://amb-daily-reporting.maddala-nitesh.workers.dev/"  # RingCentral pushes events here (instant)

[triggers]
# ONE cron on purpose. The every-minute tick drives the /gr poll AND the 10:00
# IST daily (worker.js → maybeRunDaily). A separate `30 4 * * 1-5` daily cron was
# silently dropped by a redeploy once; folding the daily into this proven-reliable
# cron removes that single point of failure and the wrangler/git deploy clobber.
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "LASTSEEN"
id = "31aa44633f0b43b1bacd1f2f1ce489da"
